name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Opinber (publishable) lykill – hannaður til að vera í vafranum; öryggið er í RLS.
          VITE_SUPABASE_URL: https://ipuajkxmbablqfyaaqrl.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_y0PxyggMoMDzYFzVnKgyDA_aaXxZ1i3
          # Vefurinn er á eigin léni (kroka.verkhonnun.is) svo base er "/".
          # Án léns (verkhonnun.github.io/kroka-fundarbokun/): repo-breytan PAGES_BASE = /kroka-fundarbokun/
          VITE_BASE: ${{ vars.PAGES_BASE || '/' }}
      # GitHub Pages þekkir ekki React Router-slóðir; 404.html endurhleður appið á réttri slóð
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
